<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitación Operativa - Procables Prysmian</title>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="header-animate">
        <!-- Contenedor del texto (se mantiene centrado) -->
        <div class="header-text">
            <h1>Prototipo Digital Interactivo Offline</h1>
            <div class="subtitle">Maquinaria de planta Procables - Prysmian Colombia</div>
        </div>
        
        <!-- Contenedor del logo a la derecha -->
        <div class="header-logo">
            <img src="assets/img/Prysmian" alt="Logo Prysmian Group">
        </div>
    </header>

    <main class="menu-container fade-in">
        
        <!-- Tarjeta Trefiladora -->
        <article class="card" data-target="trefiladora.html">
            <div class="icon-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </div>
            <h2>Trefiladora</h2>
            <p>Instructivos operativos y de seguridad.</p>
            <button class="btn-ingresar">Ingresar al módulo</button>
        </article>

        <!-- Tarjeta Cableadora -->
        <article class="card" data-target="cableadora.html">
            <div class="icon-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
            </div>
            <h2>Cableadora</h2>
            <p>Instructivos operativos y de seguridad.</p>
            <button class="btn-ingresar">Ingresar al módulo</button>
        </article>

        <!-- Tarjeta Extrusora -->
        <article class="card" data-target="extrusora.html">
            <div class="icon-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 12 12 17 22 12"></polyline>
                    <polyline points="2 17 12 22 22 17"></polyline>
                </svg>
            </div>
            <h2>Extrusora</h2>
            <p>Instructivos operativos y de seguridad.</p>
            <button class="btn-ingresar">Ingresar al módulo</button>

    <!-- Enlace al archivo de JavaScript -->
    <script src="js/main.js"></script>
